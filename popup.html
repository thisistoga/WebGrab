<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #fff;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
      transition: background 0.15s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }
    #status.error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h1>WebGrab</h1>
  <button id="capture">Capture Screenshot</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
